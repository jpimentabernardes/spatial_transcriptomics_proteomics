[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tma_toolkit"
version = "0.1.0"
description = "TMA core metadata, selection and comparison for Xenium data (AnnData)"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "numpy",
  "pandas>=2",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "h5py",
  "pyarrow",
]

[project.optional-dependencies]
de = ["pydeseq2"]
analysis = ["scanpy", "squidpy"]
excel = ["openpyxl"]
test = ["pytest"]

[tool.setuptools]
packages = ["tma_toolkit"]
